{% load i18n money ui %}
<div class="card mb-4"><div class="card-body">
  <div class="flex justify-between"><h2 class="text-base font-medium leading-tight">{{ title }}</h2><a class="text-sm" href="{% url 'invoicing:list' kind %}">{% translate "All" %}</a></div>
  {% for inv in invoices %}
    <div class="flex justify-between border-t py-2 text-sm"><a href="{% url 'invoicing:detail' kind inv.pk %}">{{ inv.display_number }} · {{ inv.party_name }}</a>
      <span><span class="num">{{ inv.total|rupiah }}</span> <span class="badge badge-{{ inv.status|status_badge }}">{{ inv.status_label }}</span></span></div>
  {% empty %}<p class="text-sm text-muted mb-0">{{ empty }}</p>{% endfor %}
</div></div>
