{% load i18n money ui %}
<div class="card mb-4"><div class="card-body">
  <div class="flex justify-between items-baseline gap-2 mb-1"><h2 class="section-heading mb-0">{{ title }}</h2><a class="text-base" href="{% url 'invoicing:list' kind %}">{% translate "All" %}</a></div>
  {% for inv in invoices %}
    <div class="flex items-start justify-between gap-3 border-t border-line py-2 text-base">
      <div class="min-w-0">
        <a href="{% url 'invoicing:detail' kind inv.pk %}" class="font-medium">{{ inv.display_number }}</a>
        <div class="truncate text-muted" title="{{ inv.party_name }}">{{ inv.party_name }}</div>
      </div>
      <div class="flex shrink-0 flex-col items-end gap-1">
        <span class="num">{{ inv.total|rupiah }}</span>
        <span class="badge badge-{% if inv.is_overdue %}danger{% else %}{{ inv.status|status_badge }}{% endif %}">{% if inv.is_overdue %}{% translate "Overdue" %}{% else %}{{ inv.status_label }}{% endif %}</span>
      </div>
    </div>
  {% empty %}<p class="text-base text-muted mb-0">{{ empty }}</p>{% endfor %}
</div></div>
