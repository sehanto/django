{% load i18n money %}
{% if summary.overdue_count %}<div class="text-base text-danger">{% icon "circle-alert" %} {% blocktranslate trimmed with amount=summary.overdue|rupiah count=summary.overdue_count %}{{ amount }} overdue ({{ count }}){% endblocktranslate %}</div>
{% else %}<div class="text-base text-muted">{% translate "Nothing overdue" %}</div>{% endif %}
