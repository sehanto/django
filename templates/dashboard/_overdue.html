{% load i18n money %}
{% if summary.overdue_count %}<div class="text-sm text-danger"><i class="bi bi-exclamation-circle" aria-hidden="true"></i> {% blocktranslate trimmed with amount=summary.overdue|rupiah count=summary.overdue_count %}{{ amount }} overdue ({{ count }}){% endblocktranslate %}</div>
{% else %}<div class="text-sm text-muted">{% translate "Nothing overdue" %}</div>{% endif %}
