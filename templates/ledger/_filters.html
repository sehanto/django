{% load i18n %}<select name="source" class="form-select w-auto min-w-0 grow sm:grow-0" aria-label="{% translate 'Source' %}"><option value="">{% translate "All sources" %}</option>{% for v, l in sources %}<option value="{{ v }}" {% if request.GET.source == v %}selected{% endif %}>{{ l }}</option>{% endfor %}</select>
