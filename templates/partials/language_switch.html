{% load i18n %}{% get_current_language as current_language %}
<form method="post" action="{% url 'accounts:set_language' %}" class="inline-flex gap-1" aria-label="{% translate 'Interface language' %}">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  {% for code, name in LANGUAGES %}
    <button name="language" value="{{ code }}" title="{{ name }}" aria-label="{{ name }}" lang="{{ code }}"
            class="btn btn-sm py-0 {% if code == current_language %}btn-secondary{% else %}btn-outline-secondary{% endif %}"
            {% if code == current_language %}aria-pressed="true"{% endif %}>{{ code|upper }}</button>
  {% endfor %}
</form>
