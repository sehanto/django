{% extends "accounts/_auth_layout.html" %}
{% block title %}Daftar{% endblock %}
{% block auth_content %}
<h2 class="h5 mb-3">Daftar & buat usaha Anda</h2>
<form method="post">{% csrf_token %}
  {% include "partials/form_fields.html" with col="col-12" %}
  <button class="btn btn-primary w-100 mt-4">Daftar</button>
</form>
<p class="text-center small mt-3 mb-0">Sudah punya akun? <a href="{% url 'accounts:login' %}">Masuk</a></p>
{% endblock %}
